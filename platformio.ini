; PlatformIO Project Configuration File for GSPro Controller
; WT32-SC01 Plus (ESP32 with 3.5" IPS Touchscreen)

[env:wt32-sc01-plus]
platform = espressif32@6.12.0
board = esp-wrover-kit
framework = arduino

; ESP32-WROVER-B specific settings
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB
; Increase available application space (OTA not required)
board_build.partitions = huge_app.csv

; Build flags
build_flags =
    -DBOARD_HAS_PSRAM
    -DLGFX_USE_V1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I src

; Monitor settings
monitor_speed = 115200
upload_speed = 921600

; Libraries (Updated December 2025)
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    lvgl/lvgl@^9.4.0
    t-vk/ESP32 BLE Keyboard@^0.3.2
